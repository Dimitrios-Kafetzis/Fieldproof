[pytest]
# Own configuration for the robots workspace so that the root pyproject.toml (pytest 9 settings
# for the uv-managed engine) does not apply to the distribution pytest that colcon test runs.
# It sits at the workspace root, above both the package sources and build/, because
# ament_add_pytest_test probes `python3 -m pytest --version` from the build directory at
# configure time and silently registers no test when that probe rejects the root settings.
addopts = -ra --strict-markers
