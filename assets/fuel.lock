# Gazebo Fuel models used by the Fieldproof worlds (task P1-T02), pinned by version and archive
# digest. Fuel models are not vendored: `make assets` (tools/assets/fetch_fuel.py) downloads each
# archive from `server`, refuses it unless its SHA-256 equals `sha256`, and extracts it to
# assets/fuel/models/<dir>, which the worlds package installs on GZ_SIM_RESOURCE_PATH so a world
# includes the model as `model://<dir>`. Pin a new model with
# `tools/assets/fetch_fuel.py add OWNER/NAME --used-by <world>`; licences are SPDX identifiers and
# must be permissive (CC0, CC-BY, Apache, MIT): no NC or ND terms, so the worlds can ship anywhere.
apiVersion: fieldproof.dev/v0alpha1
kind: FuelLock
server: https://fuel.gazebosim.org
models:
  - name: 55gal_Drum
    owner: OpenRobotics
    version: 1
    dir: 55gal_drum
    licence: CC-BY-4.0
    licence_url: http://creativecommons.org/licenses/by/4.0/
    size_bytes: 1743937
    sha256: c0367e5e8f73744a65057371de1ab94fbfe0e3eef38639820798fdf364204ad1
    used_by:
      - depot
  - name: Cardboard box
