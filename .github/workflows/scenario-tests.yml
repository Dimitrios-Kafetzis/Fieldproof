# Fieldproof scenario tests (task P1-T07): the first scenario away from the maintainer's machine.
# The UGV scenario runs headless with software rendering on a GitHub-hosted runner against the
# *published* stack images (`ghcr.io/dimitrios-kafetzis/fieldproof-{sim,bridge,base-ros2}:main`,
# or the tag a manual run names), the way a fresh clone runs it: the example vehicle image is
# built on the published base, the Fuel models fetched, then `fieldproof run` through
# tools/ci/scenario-run.sh, which applies the flaky-run policy (one retry, flagged in the job
# summary and the step outputs). The MCAP recording, the reports, the JUnit document and the
# containers' logs are uploaded as artefacts whatever the outcome.
#
# ci.yml's image job covers a change to the images themselves (it builds them and runs the
# integration tests against the result); this workflow proves the chain is reproducible from the
# registry. It is not a required status check: a flaky run never blocks a merge, and the
# definition of done asks for three consecutive green runs on main instead.
name: Scenario tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/scenario-tests.yml
      - tools/ci/scenario-run.sh
      - examples/**
      - engine/**
      - fieldproof.toml
      - Makefile
  schedule:
    # Nightly, so main keeps proving itself between pushes.
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      image-tag:
        description: Tag of the published stack images (main, vX.Y.Z or sha-<short>)
        type: string
        required: false
        default: main
      scenario:
        description: Scenario file to run
        type: string
        required: false
        default: examples/scenarios/ugv_nav_to_goal.yaml
      matrix:
        description: Matrix file to run (the matrix job)
        type: string
        required: false
        default: examples/matrices/ugv_nav_matrix.yaml
      example-repo:
        description: Example vehicle repository to onboard (a clone URL; empty for the in-tree copy)
        type: string
        required: false
        default: ""
      example-ref:
        description: Ref of the example vehicle repository
        type: string
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: scenario-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.1"
  FORCE_COLOR: "1"
  # The Makefile builds the vehicle image on `base-ros2:$FIELDPROOF_IMAGE_TAG`; the engine runs
  # `sim` and `bridge` at the same tag (fieldproof.toml, overridden by the environment).
  FIELDPROOF_IMAGE_TAG: ${{ inputs.image-tag || 'main' }}
  SCENARIO: ${{ inputs.scenario || 'examples/scenarios/ugv_nav_to_goal.yaml' }}
  MATRIX: ${{ inputs.matrix || 'examples/matrices/ugv_nav_matrix.yaml' }}
  EXAMPLE_REPO: ${{ inputs.example-repo || '' }}
  EXAMPLE_REF: ${{ inputs.example-ref || 'main' }}

jobs:
  scenario:
    name: UGV scenario (published images, software rendering)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space for the images
        run: tools/ci/free-disk.sh
      - name: Cache the Fuel archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: assets/fuel/archives
          key: fuel-${{ hashFiles('assets/fuel.lock') }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Pull the published stack images (base-ros2, sim, bridge at ${{ env.FIELDPROOF_IMAGE_TAG }})
        run: |
          for image in base-ros2 sim bridge; do
            docker pull --quiet "ghcr.io/dimitrios-kafetzis/fieldproof-${image}:${FIELDPROOF_IMAGE_TAG}"
          done
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep fieldproof-
      - name: Fetch the Fuel models pinned in assets/fuel.lock
        run: make assets
      - name: Build the example vehicle image on the published base image
        run: make vehicle-image
      - name: Validate the scenario against the workspace
        run: uv run --locked --project engine fieldproof validate "$SCENARIO"
      - name: Run the scenario (software rendering; one retry, flagged)
        id: run
        run: tools/ci/scenario-run.sh --runs-dir runs --render software "$SCENARIO"
      - name: Upload the run (MCAP recording, reports, JUnit, logs of every attempt)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-run-${{ github.run_number }}-${{ github.run_attempt }}
          path: runs
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the JUnit document of the final attempt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-junit-${{ github.run_number }}-${{ github.run_attempt }}
          path: runs/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Nothing of the run is left on the runner
        if: always()
        run: |
          left="$(docker ps -a --filter label=io.fieldproof.run --format '{{.Names}}')"
          if [ -n "$left" ]; then
            echo "::error::containers left behind: $left"
            exit 1
          fi
          echo "no container carries the io.fieldproof.run label"

  # The determinism test of task P2-T04: the lockstep scenario twice against the published
  # images, the trajectories and the odometry compared (tests/integration/test_determinism.py,
  # `make test-determinism`). Two runs of the stack, so nightly and on demand, not on every
  # pull request.
  determinism:
    name: Determinism (two lockstep runs, published images)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space for the images
        run: tools/ci/free-disk.sh
      - name: Cache the Fuel archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: assets/fuel/archives
          key: fuel-${{ hashFiles('assets/fuel.lock') }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Pull the published stack images (base-ros2, sim, bridge at ${{ env.FIELDPROOF_IMAGE_TAG }})
        run: |
          for image in base-ros2 sim bridge; do
            docker pull --quiet "ghcr.io/dimitrios-kafetzis/fieldproof-${image}:${FIELDPROOF_IMAGE_TAG}"
          done
      - name: Fetch the Fuel models pinned in assets/fuel.lock
        run: make assets
      - name: Build the example vehicle image on the published base image
        run: make vehicle-image
      - name: Two lockstep runs, compared (software rendering)
        # pytest creates --basetemp itself but not its parent.
        run: mkdir -p runs && make test-determinism PYTEST_FLAGS="--basetemp runs/determinism"
      - name: Upload the two runs (records, clock files, samples, logs)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: determinism-runs-${{ github.run_number }}-${{ github.run_attempt }}
          path: runs/determinism
          if-no-files-found: warn
          retention-days: 14
      - name: Nothing of the runs is left on the runner
        if: always()
        run: |
          left="$(docker ps -a --filter label=io.fieldproof.run --format '{{.Names}}')"
          if [ -n "$left" ]; then
            echo "::error::containers left behind: $left"
            exit 1
          fi
          echo "no container carries the io.fieldproof.run label"

  # The onboarding of task P2-T08: the example vehicle repository (fieldproof-example-vehicle,
  # the copy under examples/, or the published repository named by the `example-repo` input)
  # put next to the checkout, the way a team clones it next to theirs, and driven through its
  # own Makefile with the checkout as FIELDPROOF_ROOT: validate, build its image on the
  # published base image, run its scenario with software rendering. Its manifest extends the
  # reference UGV by name (`fieldproof:ugv_ref`), which the published bridge image resolves
  # only from the release after the task, so the job runs on main, nightly and on demand, not
  # on pull requests; ci.yml's image job runs tests/integration/test_onboarding_repo.py
  # against the images it builds instead.
  onboarding:
    name: Onboarding (the example vehicle repository, published images)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Fieldproof
      - name: Free disk space for the images
        run: Fieldproof/tools/ci/free-disk.sh
      - name: Cache the Fuel archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Fieldproof/assets/fuel/archives
          key: fuel-${{ hashFiles('Fieldproof/assets/fuel.lock') }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: Fieldproof/engine/uv.lock
      - name: Pull the published stack images (base-ros2, sim, bridge at ${{ env.FIELDPROOF_IMAGE_TAG }})
        run: |
          for image in base-ros2 sim bridge; do
            docker pull --quiet "ghcr.io/dimitrios-kafetzis/fieldproof-${image}:${FIELDPROOF_IMAGE_TAG}"
          done
      - name: Put the example vehicle repository next to the checkout
        run: |
          if [ -n "$EXAMPLE_REPO" ]; then
            git clone --depth 1 --branch "$EXAMPLE_REF" "$EXAMPLE_REPO" fieldproof-example-vehicle
          else
            cp -r Fieldproof/examples/fieldproof-example-vehicle fieldproof-example-vehicle
          fi
          ls fieldproof-example-vehicle
      - name: Fetch the Fuel models, validate the manifest and the scenarios, build the vehicle image
        working-directory: fieldproof-example-vehicle
        run: make assets validate image FIELDPROOF_ROOT=../Fieldproof
      - name: Run the example's scenario through its Makefile (software rendering)
        working-directory: fieldproof-example-vehicle
        run: make run FIELDPROOF_ROOT=../Fieldproof RUN_FLAGS="--run-id onboarding-dock --render software"
      - name: Upload the run (reports, logs, the MCAP recording)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onboarding-run-${{ github.run_number }}-${{ github.run_attempt }}
          path: fieldproof-example-vehicle/runs
          if-no-files-found: warn
          retention-days: 14
      - name: Nothing of the run is left on the runner
        if: always()
        run: |
          left="$(docker ps -a --filter label=io.fieldproof.run --format '{{.Names}}')"
          if [ -n "$left" ]; then
            echo "::error::containers left behind: $left"
            exit 1
          fi
          echo "no container carries the io.fieldproof.run label"

  # The run matrix of task P2-T06: the example matrix (twelve runs of the UGV scenario over six
  # seeds and two vehicle CPU budgets) through `fieldproof matrix` against the published images,
  # one case at a time on the runner's four cores (the scheduler fits one), failed cases retried
  # once and flagged when flaky, a single JUnit document for the twelve, the Markdown report in
  # the job summary and every run recorded in the run database. Twelve runs take about an hour,
  # so nightly and on demand, not on every pull request.
  matrix:
    name: Run matrix (twelve runs, published images)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space for the images
        run: tools/ci/free-disk.sh
      - name: Cache the Fuel archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: assets/fuel/archives
          key: fuel-${{ hashFiles('assets/fuel.lock') }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Pull the published stack images (base-ros2, sim, bridge at ${{ env.FIELDPROOF_IMAGE_TAG }})
        run: |
          for image in base-ros2 sim bridge; do
            docker pull --quiet "ghcr.io/dimitrios-kafetzis/fieldproof-${image}:${FIELDPROOF_IMAGE_TAG}"
          done
      - name: Fetch the Fuel models pinned in assets/fuel.lock
        run: make assets
      - name: Build the example vehicle image on the published base image
        run: make vehicle-image
      - name: Plan the matrix (every case resolved, the schedule printed)
        run: uv run --locked --project engine fieldproof matrix "$MATRIX" --dry-run --runs-dir runs
      - name: Run the matrix (software rendering; one retry per case, flagged)
        run: uv run --locked --project engine fieldproof matrix "$MATRIX" --render software --runs-dir runs
      - name: List the runs recorded in the run database
        if: always()
        run: uv run --locked --project engine fieldproof runs list --runs-dir runs -n 30 || true
      - name: Upload the matrix (record, JUnit, reports, every run's directory, the database)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-runs-${{ github.run_number }}-${{ github.run_attempt }}
          path: runs
          if-no-files-found: warn
          retention-days: 14
      - name: Nothing of the runs is left on the runner
        if: always()
        run: |
          left="$(docker ps -a --filter label=io.fieldproof.run --format '{{.Names}}')"
          if [ -n "$left" ]; then
            echo "::error::containers left behind: $left"
            exit 1
          fi
          echo "no container carries the io.fieldproof.run label"
