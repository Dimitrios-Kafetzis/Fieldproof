# Fieldproof documentation site (task P0-T06): builds docs/ with MkDocs Material (`make docs`,
# toolchain pinned in tools/docs), checks every link of the built site including the external ones
# (`make docs-links`), uploads the site as a Pages artifact and, on main, deploys it to GitHub
# Pages (the repository is set to deploy from a workflow). Pull requests get the build and the
# link check as a preview of the deployment but not the deployment itself; the required `CI` check
# runs the deterministic `make test-docs` in ci.yml, so a flaky external link cannot block a merge.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - tools/docs/**
      - .lychee.toml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - tools/docs/**
      - .lychee.toml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one instead of cancelling it, so a
# deployment is never left half done. Pull request runs are cancelled by a newer push.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.1"
  FORCE_COLOR: "1"

jobs:
  build:
    name: Docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: tools/docs/uv.lock
      - name: Build the site (mkdocs build --strict)
        run: make docs
      - name: Check every link of the built site, external ones included (lychee)
        run: make docs-links
      - name: Upload the site as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
