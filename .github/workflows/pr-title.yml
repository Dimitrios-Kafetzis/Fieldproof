# Pull request titles become the squash-merge commit subject on main, which release-please reads
# to decide the next version and write the changelog, so the title must be a Conventional Commit
# (task P0-T05, STATUS open question 4). The check uses the same commitlint hook and
# configuration as the local commit-msg hook (commitlint.config.mjs) and reruns when the title is
# edited. It lives in its own workflow so that editing a title does not rerun the whole of CI.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PRE_COMMIT_VERSION: "4.7.0"
  UV_VERSION: "0.13.1"

jobs:
  commitlint:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install pre-commit
        run: uv tool install "pre-commit==${PRE_COMMIT_VERSION}"
      - name: Cache the pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Check the title against commitlint.config.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: make lint-title TITLE="$PR_TITLE"
