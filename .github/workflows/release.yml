# Fieldproof releases (task P0-T05, ADR-0008). release-please keeps a release pull request open
# that collects the Conventional Commits merged to main since the last tag (`feat` bumps the
# minor version while the project is below 1.0, `fix` the patch) and updates version.txt and
# CHANGELOG.md. Merging that pull request creates the `vX.Y.Z` tag and the GitHub release, after
# which the images are built, scanned and tagged `vX.Y.Z` through images.yml.
#
# Pull requests opened with the default GITHUB_TOKEN never trigger other workflows, so the release
# pull request would have no CI checks and could not be merged under branch protection. Add a
# fine-grained personal access token (contents and pull requests: read and write) as the
# repository secret RELEASE_PLEASE_TOKEN to give it checks; the workflow falls back to
# GITHUB_TOKEN when the secret is missing.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request and tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    name: Images
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    uses: ./.github/workflows/images.yml
    permissions:
      contents: write
      packages: write
      security-events: write
    with:
      ref: ${{ needs.release-please.outputs.tag-name }}
      release-tag: ${{ needs.release-please.outputs.tag-name }}
