# Dependabot (task P0-T05): one grouped pull request per ecosystem every Monday, titled
# `build(deps): ...` so it passes commitlint and the PR title check. GitHub Actions are pinned to
# commit SHAs; Dependabot bumps the SHA and the version comment together. The pip and npm entries
# point at the engine and cockpit workspaces that P0-T07 creates and report "directory not found"
# until then. The pip entry for tools/docs covers the documentation toolchain (uv.lock).
# There is no docker entry (issue #9): the Dockerfiles reference every base image through a build
# argument and pin apt to dated snapshots, which the docker updater does not understand (and its
# Docker Hub lookups fail unauthenticated); the weekly Pins workflow (docker/pins-check.sh) is the
# replacement signal.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Athens
    labels: [layer:ci]
    commit-message:
      prefix: build(deps)
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /engine
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Athens
    labels: [layer:engine]
    commit-message:
      prefix: build(deps)
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /tools/docs
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Athens
    labels: [layer:docs]
    commit-message:
      prefix: build(deps)
    groups:
      docs:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /cockpit
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Athens
    labels: [layer:cockpit]
    commit-message:
      prefix: build(deps)
    groups:
      node:
        patterns: ["*"]
    # The cockpit follows Node 22 (.nvmrc), so its type stubs stay on that major; TypeScript 7
    # (the Go rewrite) waits until typescript-eslint supports it, and the eslint hook of
    # .pre-commit-config.yaml must move with it (make test-layout checks they agree).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
