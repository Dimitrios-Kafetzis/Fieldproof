# Fieldproof local stack (task P0-T03). Drive it through the Makefile at the repository root:
#   make images   build base-ros2, sim and dev
#   make up       start the headless Gazebo server and the dev container
#   make shell    open a shell in the dev container
#   make down     stop everything
#
# Profiles
#   sim     headless Gazebo Harmonic server running a Fieldproof world (FIELDPROOF_WORLD, default
#           depot.sdf) with the worlds, models and fetched Fuel assets bind-mounted read-only
#           (software rendering by default; add compose.gpu.yaml for a /dev/dri render node,
#           which the Makefile does automatically)
#   dev     development container with the repository bind-mounted at /workspace
#   bridge  the bridge of one vehicle (task P1-T04): the bridge launch of fieldproof_bridge on the
#           manifest FIELDPROOF_VEHICLE_MANIFEST (default: the example vehicle ugv_nav2), with the
#           repository bind-mounted read-only so the manifest's description resolves; started on
#           demand (the integration test, `docker compose --profile bridge up -d bridge`)
#   images  build-only services: the base image and the apt-lists image; never started
#
# Image names follow docs/plan/04-engineering-standards.md: <prefix><name>:<tag>. The build
# arguments GIT_SHA, BUILD_DATE and VERSION feed the OCI labels and are set by the Makefile, as
# are FIELDPROOF_APT_LISTS_CONTEXT (where the base image takes its package lists from, see
# docker/apt-lists-context.sh) and FIELDPROOF_APT_LISTS_TAG (<APT_SNAPSHOT>-<ROS_SNAPSHOT>).
name: fieldproof

x-build-args: &build-args
  GIT_SHA: ${GIT_SHA:-unknown}
  BUILD_DATE: ${BUILD_DATE:-1970-01-01T00:00:00Z}
  VERSION: ${VERSION:-0.0.0}

x-env: &env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  GZ_PARTITION: fieldproof
  # Mesa treats 0/false as off; compose.gpu.yaml overrides this to 0 when a render node is mapped.
  LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}

services:
  base-ros2:
    image: ${FIELDPROOF_IMAGE_PREFIX:-ghcr.io/dimitrios-kafetzis/fieldproof-}base-ros2:${FIELDPROOF_IMAGE_TAG:-local}
    build:
      context: ./base-ros2
      target: base
      additional_contexts:
        fieldproof-apt-lists: ${FIELDPROOF_APT_LISTS_CONTEXT:-./base-ros2/apt-lists-empty}
      args: *build-args
    profiles: [images]
    command: ["true"]

  apt-lists:
    image: ${FIELDPROOF_IMAGE_PREFIX:-ghcr.io/dimitrios-kafetzis/fieldproof-}apt-lists:${FIELDPROOF_APT_LISTS_TAG:-local}
    build:
      context: ./base-ros2
      target: apt-lists
      additional_contexts:
        fieldproof-apt-lists: ${FIELDPROOF_APT_LISTS_CONTEXT:-./base-ros2/apt-lists-empty}
      args: *build-args
    profiles: [images]
    command: ["true"]

  sim:
    image: ${FIELDPROOF_IMAGE_PREFIX:-ghcr.io/dimitrios-kafetzis/fieldproof-}sim:${FIELDPROOF_IMAGE_TAG:-local}
    build:
      context: ./sim
      additional_contexts:
        fieldproof-base-ros2: service:base-ros2
      args:
        <<: *build-args
        BASE_IMAGE: fieldproof-base-ros2
    profiles: [sim]
    hostname: sim
    command: ["gz", "sim", "-s", "-r", "--headless-rendering", "${FIELDPROOF_WORLD:-depot.sdf}"]
    environment:
      <<: *env
      # The Fieldproof worlds, the package models, the fetched Fuel models and the reference
      # vehicle models, bind-mounted below (task P1-T02); Gazebo's own worlds stay reachable.
      GZ_SIM_RESOURCE_PATH: /fieldproof/worlds:/fieldproof/models:/fieldproof/fuel:/fieldproof/robots
    volumes:
      - ../sim/fieldproof_worlds/worlds:/fieldproof/worlds:ro
      - ../sim/fieldproof_worlds/models:/fieldproof/models:ro
      - ../assets/fuel/models:/fieldproof/fuel:ro
      - ../robots/fieldproof_robots/models:/fieldproof/robots:ro
    networks: [fieldproof]
    stop_grace_period: 10s

  bridge:
    image: ${FIELDPROOF_IMAGE_PREFIX:-ghcr.io/dimitrios-kafetzis/fieldproof-}bridge:${FIELDPROOF_IMAGE_TAG:-local}
    build:
      context: ./bridge
      additional_contexts:
        fieldproof-sim: service:sim
        # The two packages the image builds, straight from the repository.
        fieldproof-bridge-src: ../bridge/fieldproof_bridge
        fieldproof-robots-src: ../robots/fieldproof_robots
      args:
        <<: *build-args
        BASE_IMAGE: fieldproof-sim
    profiles: [bridge]
    hostname: bridge
    environment:
      <<: *env
      FIELDPROOF_MANIFEST: ${FIELDPROOF_VEHICLE_MANIFEST:-/workspace/examples/vehicles/ugv_nav2/robot.yaml}
    volumes:
      - ..:/workspace:ro
    networks: [fieldproof]
    stop_grace_period: 5s

  dev:
    image: ${FIELDPROOF_IMAGE_PREFIX:-ghcr.io/dimitrios-kafetzis/fieldproof-}dev:${FIELDPROOF_IMAGE_TAG:-local}
    build:
      context: ./dev
      additional_contexts:
        fieldproof-sim: service:sim
      args:
        <<: *build-args
        BASE_IMAGE: fieldproof-sim
    profiles: [dev]
    hostname: dev
    command: ["sleep", "infinity"]
    environment: *env
    volumes:
      - ..:/workspace
      - dev-cache:/home/fieldproof/.cache
    working_dir: /workspace
    networks: [fieldproof]
    stop_grace_period: 2s

networks:
  fieldproof:
    name: fieldproof

volumes:
  dev-cache:
