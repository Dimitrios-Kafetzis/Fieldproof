# The Fieldproof scenario engine and CLI (task P0-T07, ADR-0009). A uv-managed Python 3.12 package
# with a src/ layout; `uv sync --locked --project engine` creates engine/.venv and `uv run
# --project engine fieldproof --version` runs the CLI. Lint and type-check settings are inherited
# from the repository root pyproject.toml. The version is dynamic: hatchling reads it from the
# repository's version.txt (maintained by release-please), so a release bump changes no file here
# and uv.lock, which records no version for a dynamic project, stays current.
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "fieldproof"
dynamic = ["version"]
description = "Fieldproof scenario engine and command line interface"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Dimitris Kafetzis" }]
keywords = ["robotics", "simulation", "ros2", "gazebo", "scenario", "testing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# Exact pins: the lock file resolves the transitive dependencies, Dependabot proposes bumps weekly.
# fieldproof-bridge is the bridge ROS package of this repository (bridge/fieldproof_bridge), installed
# from its path so that `fieldproof bridge gen` runs the generator the bridge container runs.
dependencies = [
  "docker==7.2.0",
  "fieldproof-bridge",
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
  "rich==15.0.0",
  "typer==0.27.3",
]

[project.urls]
Homepage = "https://github.com/Dimitrios-Kafetzis/Fieldproof"
Documentation = "https://dimitrios-kafetzis.github.io/Fieldproof/"
Repository = "https://github.com/Dimitrios-Kafetzis/Fieldproof"
Issues = "https://github.com/Dimitrios-Kafetzis/Fieldproof/issues"

[project.scripts]
fieldproof = "fieldproof.cli:main"

# The built-in events (task P2-T03, docs/reference/events.md): the engine registers them the
# way a plugin does, one entry point per action, and loads them directly as well (an engine
# checkout without its metadata still knows them). A plugin installed next to the engine adds
# its own under the same group (examples/plugins/example_events).
[project.entry-points."fieldproof.events"]
navigate_to_pose = "fieldproof.events.navigation:NavigateToPoseEvent"
"link.set" = "fieldproof.events.link:LinkSetEvent"
"link.drop" = "fieldproof.events.link:LinkDropEvent"
"link.restore" = "fieldproof.events.link:LinkRestoreEvent"
"container.pause" = "fieldproof.events.container:ContainerPauseEvent"
"container.resume" = "fieldproof.events.container:ContainerResumeEvent"
"container.kill" = "fieldproof.events.container:ContainerKillEvent"
"param.set" = "fieldproof.events.param:ParamSetEvent"
spawn_object = "fieldproof.events.world:SpawnObjectEvent"
remove_object = "fieldproof.events.world:RemoveObjectEvent"
teleport = "fieldproof.events.world:TeleportEvent"
set_wind = "fieldproof.events.world:SetWindEvent"
"gps.deny" = "fieldproof.events.faults:GpsDenyEvent"
"gps.offset" = "fieldproof.events.faults:GpsOffsetEvent"
"imu.bias" = "fieldproof.events.faults:ImuBiasEvent"
"sensor.dropout" = "fieldproof.events.faults:SensorDropoutEvent"
"sensor.freeze" = "fieldproof.events.faults:SensorFreezeEvent"
"battery.drain" = "fieldproof.events.faults:BatteryDrainEvent"
"actuator.limit" = "fieldproof.events.faults:ActuatorLimitEvent"
"sim.pause" = "fieldproof.events.sim:SimPauseEvent"
"sim.resume" = "fieldproof.events.sim:SimResumeEvent"
"sim.step" = "fieldproof.events.sim:SimStepEvent"

# The built-in assertion types (task P2-T05, docs/reference/assertions.md), registered the same
# way: one entry point per type. A plugin adds its own under this group
# (examples/plugins/example_assertions).
[project.entry-points."fieldproof.assertions"]
reach_pose = "fieldproof.assertions.primitives:ReachPoseType"
within_time = "fieldproof.assertions.primitives:WithinTimeType"
topic_rate = "fieldproof.assertions.primitives:TopicRateType"
no_collision = "fieldproof.assertions.primitives:NoCollisionType"
topic_value = "fieldproof.assertions.primitives:TopicValueType"
geofence = "fieldproof.assertions.spatial:GeofenceType"
min_distance = "fieldproof.assertions.spatial:MinDistanceType"
path_efficiency = "fieldproof.assertions.spatial:PathEfficiencyType"
mission_time = "fieldproof.assertions.timing:MissionTimeType"
message_latency = "fieldproof.assertions.timing:MessageLatencyType"
sequence = "fieldproof.assertions.timing:SequenceType"
resource_usage = "fieldproof.assertions.system:ResourceUsageType"
lifecycle_state = "fieldproof.assertions.system:LifecycleStateType"
always = "fieldproof.assertions.temporal:AlwaysType"
never = "fieldproof.assertions.temporal:NeverType"
eventually = "fieldproof.assertions.temporal:EventuallyType"

[tool.uv.sources]
fieldproof-bridge = { path = "../bridge/fieldproof_bridge", editable = true }
fieldproof-example-events = { path = "../examples/plugins/example_events", editable = true }
fieldproof-example-assertions = { path = "../examples/plugins/example_assertions", editable = true }

# The example plugins are development dependencies: installed here, they are registered next
# to the built-ins (`fieldproof events`, `fieldproof assertions`), their tests run with the
# engine's, and the example scenarios that use them validate.
[dependency-groups]
dev = [
  "fieldproof-example-events",
  "fieldproof-example-assertions",
  "mcap==1.5.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "types-docker==7.2.0.20261006",
]

[tool.hatch.version]
source = "regex"
path = "../version.txt"
pattern = "^(?P<version>\\d+\\.\\d+\\.\\d+.*)$"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldproof"]

[tool.uv]
# Rebuild the editable install when the version file changes, not only on pyproject.toml edits.
cache-keys = [{ file = "pyproject.toml" }, { file = "../version.txt" }]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = [
  "tests",
  "../examples/plugins/example_events/tests",
  "../examples/plugins/example_assertions/tests",
]
xfail_strict = true

# `make test-engine` runs pytest with --cov: the standards ask for 85 % of the engine's lines
# (04-engineering-standards.md), the readiness probe's rclpy half runs only inside a vehicle.
[tool.coverage.run]
source = ["fieldproof"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
