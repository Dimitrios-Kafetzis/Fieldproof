# hadolint (task P0-T04). Dockerfiles follow 04-engineering-standards.md: pinned base digests,
# --no-install-recommends, non-root runtime user, cache mounts.
failure-threshold: warning
trustedRegistries:
  - docker.io
  - ghcr.io
ignored: []
override:
  error:
    - DL3006 # always tag the base image
    - DL3007 # never use :latest
    - DL3008 # pin apt package versions
    - DL3015 # --no-install-recommends
    - DL3002 # last user must not be root
