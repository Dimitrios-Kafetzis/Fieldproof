# An obstacle appears on the planned path and Nav2 replans around it (task P2-T03, session 2,
# the first definition-of-done scenario; docs/reference/events.md). The example vehicle ugv_nav2
# drives 4.5 m ahead from the loading dock through the roller door into the yard, as in
# ugv_nav_to_goal.yaml. Half a metre into the drive (`when: distance_to` the spawn), the
# `spawn_object` event puts a 0.6 m crate on the straight line to the goal, 1.7 m ahead of the
# vehicle and in the lidar's view (a Nav2 planner fails on goals in unseen space, not on
# obstacles it sees). The lidar puts the crate into the costmaps, the planner's next cycle
# routes around it (the roller door is 4 m wide) and the controller follows: the vehicle
# reaches the goal without touching anything, while the path keeps being published.
#
# The crate is a box with a box collision (a mesh on the ground plane would halve the real-time
# factor, docs/reference/worlds.md), placed by the WorldEvents plugin of the world
# (sim/fieldproof_gz_plugins) and removed once the goal is reached, so the course is clean for a
# later leg. Every occurrence is in run.json (timeline[]) and on /fieldproof/events.
#
#   fieldproof validate examples/scenarios/ugv_obstacle_replan.yaml
#   fieldproof run examples/scenarios/ugv_obstacle_replan.yaml
apiVersion: fieldproof.dev/v0alpha1
kind: Scenario
metadata:
  name: ugv_obstacle_replan
  description: A crate spawns on the example UGV's planned path and Nav2 replans around it
  tags: [events, nav, ugv, obstacle]
world:
  file: depot.sdf
vehicles:
  - name: ugv1
    manifest: ../vehicles/ugv_nav2/robot.yaml
    spawn:
      frame: spawn_dock # (10, 3), facing the roller door at y = 0
time:
  mode: sim
  timeout_s: 10m
timeline:
  - at: 0s
    name: drive_ahead
    vehicle: ugv1
    action: navigate_to_pose
    goal: { x: 10.0, y: -1.5, yaw: -1.5708 } # 4.5 m ahead, through the door, into the yard
    timeout_s: 5m
  - name: spawn_crate
    when: # the first ground-truth sample half a metre from the spawn: the vehicle is moving
      vehicle: ugv1
      metric: distance_to
      target: { frame: spawn_dock }
      condition: value > 0.5
    within_s: 3m # skipped (and crate_spawned fails) if the vehicle never moves
    action: spawn_object
    model: crate
    shape: box
    size: [0.6, 0.6, 0.5]
    pose: { x: 10.0, y: 0.8 } # on the straight line, 1.7 m ahead of the vehicle, before the door
    static: true
  - name: clear_crate
    after: drive_ahead
    action: remove_object
    model: crate
assertions:
  - name: crate_spawned # the when held and the plugin spawned the crate
    type: within_time
    action: spawn_crate
    max_s: 2m
  - name: reached_goal # around the crate and through the door
    type: reach_pose
    vehicle: ugv1
    target: { x: 10.0, y: -1.5 }
    tolerance_m: 0.5
  - name: arrived_in_time
    type: within_time
    action: drive_ahead
    max_s: 4m
  - name: kept_planning # Nav2 kept publishing its path while it drove (the replans among them)
    type: topic_rate
    topic: plan
    vehicle: ugv1
    min_hz: 0.3 # the behaviour tree replans at 1 Hz of simulation time
    window_s: 5s
    after_s: 5s
  - name: no_collision # the chassis touched neither the crate nor the door
    type: no_collision
    vehicle: ugv1
  - name: crate_cleared
    type: within_time
    action: clear_crate
    max_s: 30s
outputs:
  logs: true
  record: true
  topics:
    - /clock
    - /tf
    - /tf_static
    - /odom
    - /cmd_vel
    - /scan
    - /plan
    - /local_costmap/costmap
    - /rosout
