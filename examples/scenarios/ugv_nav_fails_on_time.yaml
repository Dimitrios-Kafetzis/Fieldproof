# A scenario that fails on purpose (task P1-T06): the same run as ugv_nav_to_goal.yaml, with the
# within_time assertion given one second, which no navigation to a goal 4 m away can meet. The
# run ends FAIL naming `arrived_in_time`, the other assertions pass, and the report shows what a
# failure looks like. The integration test runs it to check the exit code semantics.
#
#   fieldproof run examples/scenarios/ugv_nav_fails_on_time.yaml; echo "exit $?"   # 1
apiVersion: fieldproof.dev/v0alpha1
kind: Scenario
metadata:
  name: ugv_nav_fails_on_time
  description: The example UGV's navigation is given one second, so the run fails on arrived_in_time
  tags: [nav, ugv, failing]
world:
  file: depot.sdf
vehicles:
  - name: ugv1
    manifest: ../vehicles/ugv_nav2/robot.yaml
    spawn:
      frame: spawn_dock
time:
  mode: sim
  timeout_s: 10m
timeline:
  - at: 0s
    name: drive_ahead
    vehicle: ugv1
    action: navigate_to_pose
    goal: { x: 10.0, y: -1.0, yaw: -1.5708 }
    timeout_s: 5m
assertions:
  - name: reached_goal
    type: reach_pose
    vehicle: ugv1
    target: { x: 10.0, y: -1.0 }
    tolerance_m: 0.5
  - name: arrived_in_time # fails: a 4 m drive takes longer than a second
    type: within_time
    action: drive_ahead
    max_s: 1s
  - name: no_collision
    type: no_collision
    vehicle: ugv1
outputs:
  logs: true
  record: false
