# The first Fieldproof scenario (task P1-T05): the example vehicle ugv_nav2 (the reference UGV
# running Nav2 and SLAM Toolbox) spawns at the depot's loading dock and drives to a goal 4 m
# ahead, the vertical slice of task P1-T04 as a scenario file. Schema: docs/reference/scenarios.md
# (`fieldproof schema`).
#
#   fieldproof validate examples/scenarios/ugv_nav_to_goal.yaml
#   fieldproof run examples/scenarios/ugv_nav_to_goal.yaml
apiVersion: fieldproof.dev/v0alpha1
kind: Scenario
metadata:
  name: ugv_nav_to_goal
  description: The example UGV navigates from the depot's loading dock to a goal 4 m ahead
  tags: [smoke, nav, ugv]
world:
  file: depot.sdf
vehicles:
  - name: ugv1
    manifest: ../vehicles/ugv_nav2/robot.yaml
    spawn:
      frame: spawn_dock # (10, 3), facing the roller door
time:
  mode: sim
  timeout_s: 10m # wall-clock budget once the vehicle is ready
timeline:
  - at: 0s
    name: drive_ahead
    vehicle: ugv1
    action: navigate_to_pose
    goal: { x: 10.0, y: -1.0, yaw: -1.5708 } # 4 m ahead of spawn_dock, in the world
    timeout_s: 5m
assertions:
  # Declared for task P1-T06, which evaluates them; recorded as skipped until then.
  - name: reached_goal
    type: reach_pose
    vehicle: ugv1
    target: { x: 10.0, y: -1.0 }
    tolerance_m: 0.5
outputs:
  logs: true
