# The first Fieldproof scenario (tasks P1-T05, P1-T06): the example vehicle ugv_nav2 (the
# reference UGV running Nav2 and SLAM Toolbox) spawns at the depot's loading dock and drives to a
# goal 4 m ahead, the vertical slice of task P1-T04 as a scenario file, with the five assertion
# primitives turning the run into a test and the topics recorded to MCAP. Schema:
# docs/reference/scenarios.md (`fieldproof schema`); assertions: docs/reference/assertions.md.
#
#   fieldproof validate examples/scenarios/ugv_nav_to_goal.yaml
#   fieldproof run examples/scenarios/ugv_nav_to_goal.yaml
#   fieldproof report runs/<run_id>
apiVersion: fieldproof.dev/v0alpha1
kind: Scenario
metadata:
  name: ugv_nav_to_goal
  description: The example UGV navigates from the depot's loading dock to a goal 4 m ahead
  tags: [smoke, nav, ugv]
world:
  file: depot.sdf
vehicles:
  - name: ugv1
    manifest: ../vehicles/ugv_nav2/robot.yaml
    spawn:
      frame: spawn_dock # (10, 3), facing the roller door
time:
  mode: sim
  timeout_s: 10m # wall-clock budget once the vehicle is ready
timeline:
  - at: 0s
    name: drive_ahead
    vehicle: ugv1
    action: navigate_to_pose
    goal: { x: 10.0, y: -1.0, yaw: -1.5708 } # 4 m ahead of spawn_dock, in the world
    timeout_s: 5m
assertions:
  # Ground truth from Gazebo: the model ends up within half a metre of the goal.
  - name: reached_goal
    type: reach_pose
    vehicle: ugv1
    target: { x: 10.0, y: -1.0 }
    tolerance_m: 0.5
  # The navigation action reports its result within four minutes (wall clock; generous for a
  # CI runner with software rendering, where the simulation runs below real time).
  - name: arrived_in_time
    type: within_time
    action: drive_ahead
    max_s: 4m
  # The lidar keeps publishing (measured in simulation time). Its nominal rate is 10 Hz and a
  # GPU host achieves it, but with software rendering on a two-core CI runner the sensor
  # thread falls behind the physics and the scan arrives at about 3 Hz of simulation time, so
  # the example asks for a floor every host clears; a scenario for GPU hosts can ask for 8 Hz.
  - name: lidar_streams
    type: topic_rate
    topic: scan
    vehicle: ugv1
    min_hz: 2.0
    window_s: 5s
    after_s: 5s
  # The chassis never touches the world (the model's ground-truth contact sensor).
  - name: no_collision
    type: no_collision
    vehicle: ugv1
  # Nav2 never commands more than the manifest's forward speed limit (1.5 m/s).
  - name: speed_limit
    type: topic_value
    topic: cmd_vel
    vehicle: ugv1
    field: linear.x
    condition: value <= 1.5
  # --- assertion library v1 (task P2-T05, docs/reference/assertions.md#the-library) ---
  # The drive stays in the dock's yard: a box around the dock and the goal (the building's
  # south wall is at y = 0, the roller door the vehicle drives through at x = 10).
  - name: stays_in_yard
    type: geofence
    vehicle: ugv1
    region: { box: { x_min: 5.0, x_max: 15.0, y_min: -5.0, y_max: 7.0 } }
  # A 4 m drive in open space is close to a straight line (the path from the ground truth
  # over the straight line to the goal; 0.95 on a GPU host).
  - name: drives_straight
    type: path_efficiency
    vehicle: ugv1
    action: drive_ahead
    target: { x: 10.0, y: -1.0 }
    min_ratio: 0.6
  # The whole timeline completes within five minutes of wall clock (the drive is the only
  # entry; `within_time` bounds one entry, `mission_time` a span of the timeline).
  - name: mission_in_time
    type: mission_time
    max_s: 5m
  # The odometry arrives fresh: the 95th percentile of the age of its messages (header stamp
  # against the simulation clock when the observer receives them) stays under a quarter of a
  # second of simulation time over every 2 s window.
  - name: odom_fresh
    type: message_latency
    topic: odom
    vehicle: ugv1
    max_ms: 250
    after_s: 2s
  # The stack fits its budget: the vehicle container's memory stays under 1.8 GiB (the
  # manifest's limit is 2 GiB) and its CPU under 250 % of a core averaged over 10 s (the
  # quota is two cores; the daemon's samples overshoot it by a few percent).
  - name: stack_fits
    type: resource_usage
    vehicle: ugv1
    max_memory_mb: 1800
    max_cpu_pct: 250
    window_s: 10s
  # Nav2's behaviour-tree navigator stays active throughout (the readiness probe waited for
  # it; a lifecycle manager that deactivated it mid-run would show here).
  - name: navigator_active
    type: lifecycle_state
    vehicle: ugv1
    node: bt_navigator
    state: active
    mode: always
  # Events in order: the goal is sent, Nav2 commands a forward speed, the goal is reached.
  - name: mission_order
    type: sequence
    vehicle: ugv1
    steps:
      - { action: drive_ahead, event: started }
      - { topic: cmd_vel, field: linear.x, condition: value > 0 }
      - { assertion: reached_goal }
  # A condition over two signals: the vehicle slows down as it arrives (within 0.6 m of
  # the goal with the wheel odometry under 0.5 m/s), an `eventually` combinator.
  - name: slows_at_goal
    type: eventually
    vehicle: ugv1
    signals:
      d: { metric: distance_to, target: { x: 10.0, y: -1.0 } }
      v: { topic: odom, field: twist.twist.linear.x }
    condition: d < 0.6 and abs(v) < 0.5
kpis: # measured, not judged: the run's KPIs in run.json, the report and /fieldproof/kpis
  - { name: drive, type: path, vehicle: ugv1, action: drive_ahead, target: { x: 10.0, y: -1.0 } }
  - { name: mission, type: mission_time }
  - { name: scan_age, type: latency, topic: scan, vehicle: ugv1 }
  - { name: stack, type: resources, vehicle: ugv1 }
  - { name: commanded, type: value, topic: cmd_vel, vehicle: ugv1, field: linear.x, count_if: value > 0 }
outputs:
  logs: true
  record: true # recording/*.mcap in the run directory (opens in Foxglove Studio)
  # video: true records the drive from the depot's spectator camera (video/spectator.mp4), as
  # the M1 demo does with `fieldproof run --video`; off here because rendering the camera
  # halves the simulator's speed and starves the lidar with software rendering, which would
  # change what the assertions measure (docs/reference/scenarios.md#video).
  topics: # the allow-list; the /fieldproof/* side channels are always recorded
    - /clock
    - /tf
    - /tf_static
    - /odom
    - /cmd_vel
    - /scan
    - /imu/data
    - /map
    - /plan
    - /rosout
