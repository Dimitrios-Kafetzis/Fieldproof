# Parameters of the hardware drivers (drivers.launch.py), field side only: serial ports and frames
# of the example UGV. Not read in Fieldproof, where the bridge provides these interfaces.
controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
diff_drive_controller:
  ros__parameters:
    left_wheel_names: [wheel_left_joint]
    right_wheel_names: [wheel_right_joint]
    wheel_separation: 0.48
    wheel_radius: 0.11
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    linear.x.max_velocity: 1.5
    linear.x.max_acceleration: 2.0
    angular.z.max_velocity: 3.0
    angular.z.max_acceleration: 4.0
rplidar:
  ros__parameters:
    serial_port: /dev/ttyUSB0
    serial_baudrate: 256000
    frame_id: lidar_link
    angle_compensate: true
    scan_mode: Standard
imu:
  ros__parameters:
    port: /dev/ttyACM0
    baudrate: 115200
    frame_id: imu_link
    imu_data_rate: 100
    publish_imu: true
gnss:
  ros__parameters:
    port: /dev/ttyUSB1
    baud: 9600
    frame_id: gps_link
    useRMC: false
camera:
  ros__parameters:
    rgb_camera.color_profile: 640x480x15
    depth_module.depth_profile: 640x480x15
    enable_color: true
    enable_depth: true
    align_depth.enable: true
