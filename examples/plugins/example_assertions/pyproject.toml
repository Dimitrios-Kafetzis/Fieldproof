# An example assertion plugin for the Fieldproof engine (task P2-T05,
# docs/reference/assertions.md). Installed next to the engine (the engine's dev dependency group
# carries it, so `uv sync --project engine` registers it), it adds the assertion type
# `example.visits_waypoints` through the `fieldproof.assertions` entry point group. Copy this
# directory to start a plugin of your own.
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "fieldproof-example-assertions"
version = "0.1.0"
description = "An example Fieldproof assertion plugin: example.visits_waypoints"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["fieldproof"]

# One entry point per assertion type: the name is the type, the value the AssertionType subclass.
[project.entry-points."fieldproof.assertions"]
"example.visits_waypoints" = "fieldproof_example_assertions:VisitsWaypointsType"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldproof_example_assertions"]
