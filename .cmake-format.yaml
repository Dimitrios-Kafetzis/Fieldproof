# cmake-format / cmake-lint configuration (task P0-T04) for the ament_cmake packages in sim/ and
# bridge/. 100 columns, two-space indent, lower-case commands.
format:
  line_width: 100
  tab_size: 2
  use_tabchars: false
  max_subgroups_hwrap: 2
  max_pargs_hwrap: 6
  dangle_parens: false
  min_prefix_chars: 4
  max_prefix_chars: 10
  command_case: lower
  keyword_case: upper
  enable_sort: true
  autosort: true
  line_ending: unix
markup:
  enable_markup: false
lint:
  disabled_codes:
    - C0113 # missing COMMENT in custom commands: not required by ament
  max_arguments: 8
  max_statements: 60
  max_branches: 12
